<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#070D1E" />
      <stop offset="100%" stop-color="#0A101F" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="15%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="1" />
      <stop offset="85%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.05" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="matrixGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#22D3EE" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono-title { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-weight: 900; letter-spacing: 12px; }
    .mono-sub { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-weight: 700; letter-spacing: 4px; }
    .mono-label { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; letter-spacing: 2px; }
    .circuit-line { stroke: #22D3EE; stroke-width: 1; fill: none; stroke-opacity: 0.25; }
    .bracket { stroke: #22D3EE; stroke-width: 2; fill: none; stroke-opacity: 0.7; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="280" fill="url(#bgGrad)" />
  <rect width="1200" height="280" fill="url(#matrixGrid)" />

  <!-- Outer Border Frame -->
  <rect x="10" y="10" width="1180" height="260" fill="none" stroke="#1E293B" stroke-width="1.5" rx="6" />

  <!-- Geometric Corner Reticles -->
  <path d="M 18 35 L 18 18 L 35 18" class="bracket" />
  <path d="M 1182 35 L 1182 18 L 1165 18" class="bracket" />
  <path d="M 18 245 L 18 262 L 35 262" class="bracket" />
  <path d="M 1182 245 L 1182 262 L 1165 262" class="bracket" />

  <!-- Abstract Circuit Traces (Left & Right Wings) -->
  <path d="M 40 140 L 120 140 L 150 110 L 220 110" class="circuit-line" />
  <circle cx="220" cy="110" r="2.5" fill="#22D3EE" fill-opacity="0.6" />
  <path d="M 40 180 L 90 180 L 120 210 L 200 210" class="circuit-line" />
  <circle cx="200" cy="210" r="2.5" fill="#A78BFA" fill-opacity="0.6" />

  <path d="M 1160 140 L 1080 140 L 1050 110 L 980 110" class="circuit-line" />
  <circle cx="980" cy="110" r="2.5" fill="#22D3EE" fill-opacity="0.6" />
  <path d="M 1160 180 L 1110 180 L 1080 210 L 1000 210" class="circuit-line" />
  <circle cx="1000" cy="210" r="2.5" fill="#A78BFA" fill-opacity="0.6" />

  <!-- Top System Bar -->
  <g transform="translate(35, 34)">
    <circle cx="6" cy="6" r="4" fill="#10B981" />
    <circle cx="6" cy="6" r="8" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <text x="24" y="10" fill="#22D3EE" class="mono-label">HOST: ARCH-HARDENED</text>
    <text x="200" y="10" fill="#64748B" class="mono-label">//</text>
    <text x="225" y="10" fill="#94A3B8" class="mono-label">ARCH: x86_64 :: RING-0</text>
    <text x="430" y="10" fill="#64748B" class="mono-label">//</text>
    <text x="455" y="10" fill="#A78BFA" class="mono-label">SYS_ID: 0x7FFF_FFFF_E000</text>

    <!-- Right Aligned Status -->
    <rect x="990" y="-2" width="135" height="18" rx="3" fill="#0E172A" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1002" cy="7" r="3" fill="#22D3EE" />
    <text x="1014" y="10" fill="#22D3EE" class="mono-label" font-size="9.5">STATUS: ONLINE</text>
  </g>

  <line x1="35" y1="52" x2="1165" y2="52" stroke="#1E293B" stroke-width="1" />

  <!-- Center Identity Block -->
  <g transform="translate(600, 135)" text-anchor="middle">
    <!-- Glow Underlay -->
    <text x="0" y="0" font-size="70" fill="url(#cyanViolet)" class="mono-title" filter="url(#neonGlow)" opacity="0.3">DDW-X</text>
    <!-- Crisp Foreground Text -->
    <text x="0" y="0" font-size="70" fill="url(#cyanViolet)" class="mono-title">DDW-X</text>
    
    <!-- Subtitle -->
    <text x="0" y="32" font-size="13" fill="#94A3B8" class="mono-sub">LOW-LEVEL SYSTEMS ARCHITECTURE &amp; EXPLOIT RESEARCH</text>
  </g>

  <!-- Bottom Core Capability Tags -->
  <g transform="translate(600, 218)" text-anchor="middle">
    <rect x="-380" y="-12" width="170" height="24" rx="4" fill="#0E172A" stroke="#1E293B" stroke-width="1" />
    <text x="-295" y="4" fill="#22D3EE" class="mono-label" font-size="10.5">:: KERNEL DRIVERS</text>

    <rect x="-190" y="-12" width="170" height="24" rx="4" fill="#0E172A" stroke="#1E293B" stroke-width="1" />
    <text x="-105" y="4" fill="#10B981" class="mono-label" font-size="10.5">:: REVERSE ENGINEERING</text>

    <rect x="0" y="-12" width="170" height="24" rx="4" fill="#0E172A" stroke="#1E293B" stroke-width="1" />
    <text x="85" y="4" fill="#818CF8" class="mono-label" font-size="10.5">:: GPGPU COMPUTING</text>

    <rect x="190" y="-12" width="180" height="24" rx="4" fill="#0E172A" stroke="#1E293B" stroke-width="1" />
    <text x="280" y="4" fill="#A78BFA" class="mono-label" font-size="10.5">:: COGNITIVE AGENTS</text>
  </g>

  <!-- Bottom Accent Divider Line -->
  <line x1="100" y1="248" x2="1100" y2="248" stroke="url(#lineGrad)" stroke-width="1.5" />
</svg>
